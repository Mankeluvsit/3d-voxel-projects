<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PolyCity AI 3D</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Hide scrollbar for main view to act like a game canvas */
        body { overflow: hidden; background-color: #0c4a6e; /* sky-900 */ }
    </style>
    <script>
        // Suppress benign connection errors and unhandled WebSocket/HMR disconnect warnings
        // so they don't pop up the developer console overlay in the embedded preview iframe
        window.addEventListener('unhandledrejection', function(event) {
            if (event.reason && (
                (typeof event.reason === 'string' && event.reason.includes('WebSocket')) ||
                (event.reason.message && event.reason.message.includes('WebSocket')) ||
                (event.reason.stack && event.reason.stack.includes('vite'))
            )) {
                event.preventDefault();
                console.warn('Benign HMR status rejection suppressed:', event.reason);
            }
        });

        window.addEventListener('error', function(event) {
            if (event.message && (
                event.message.indexOf('websocket') !== -1 || 
                event.message.indexOf('WebSocket') !== -1 || 
                event.message.indexOf('vite') !== -1
            )) {
                event.preventDefault();
                console.warn('Benign HMR Network error suppressed:', event.message);
            }
        }, true);
    </script>
  <script type="module" crossorigin src="./assets/index-ZfWiGbj5.js"></script>
</head>
<body>
    <div id="root"></div>
</body>
</html>
